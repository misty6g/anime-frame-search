[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anime-frame-search"
version = "1.0.0"
description = "CLIP-powered visual search over synthetic anime-style short-clip frames"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Gyan Mistry" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "numpy>=1.26.0",
  "Pillow>=10.0.0",
  "pydantic>=2.0.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]
clip = ["sentence-transformers>=3.0.0", "torch>=2.0.0"]

[project.scripts]
anime-frame-search = "app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
